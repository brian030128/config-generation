# SonarCloud configuration
# Update sonar.organization / sonar.projectKey to match your SonarCloud account.
sonar.organization=REPLACE_WITH_SONARCLOUD_ORG
sonar.projectKey=REPLACE_WITH_PROJECT_KEY
sonar.projectName=config-generation

# Source layout
sonar.sources=backend,frontend/src
sonar.tests=backend
sonar.test.inclusions=backend/**/*_test.go
sonar.exclusions=\
  backend/db/migrations/**,\
  backend/bddtest/**,\
  backend/dbtest/**,\
  frontend/dist/**,\
  frontend/node_modules/**

# Go coverage (generated by `go test -coverprofile=coverage.out`)
sonar.go.coverage.reportPaths=backend/coverage.out

# TypeScript / React
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Source encoding
sonar.sourceEncoding=UTF-8
