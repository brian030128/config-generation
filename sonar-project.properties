# SonarCloud configuration
# Update sonar.organization / sonar.projectKey to match your SonarCloud account.
sonar.organization=REPLACE_WITH_SONARCLOUD_ORG
sonar.projectKey=REPLACE_WITH_PROJECT_KEY
sonar.projectName=config-generation

# Source layout
sonar.sources=backend,frontend/src
sonar.tests=backend
sonar.test.inclusions=backend/**/*_test.go
sonar.exclusions=\
  backend/db/migrations/**,\
  backend/bddtest/**,\
  backend/dbtest/**,\
  frontend/dist/**,\
  frontend/node_modules/**

# Go coverage (generated by `go test -coverprofile=coverage.out`)
sonar.go.coverage.reportPaths=backend/coverage.out

# TypeScript / React
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Source encoding
sonar.sourceEncoding=UTF-8

# ── Targeted rule suppressions ──────────────────────────────────────────────
# The CSRF cookie helpers in backend/handlers/auth.go intentionally:
#   - set HttpOnly=false  (double-submit pattern: frontend reads the cookie
#     to populate the X-CSRF-Token header; see middleware/csrf.go)
#   - set Secure from SESSION_COOKIE_SECURE  (true in prod HTTPS, false for
#     local docker-compose / Kind dev on plain HTTP)
# Both flags are documented at the call sites. Suppress the corresponding
# rules only for this single file so other handlers are still scanned.
sonar.issue.ignore.multicriteria=csrfHttpOnly,csrfSecure
sonar.issue.ignore.multicriteria.csrfHttpOnly.ruleKey=go:S3330
sonar.issue.ignore.multicriteria.csrfHttpOnly.resourceKey=backend/handlers/auth.go
sonar.issue.ignore.multicriteria.csrfSecure.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.csrfSecure.resourceKey=backend/handlers/auth.go
