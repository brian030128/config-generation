# Local development overrides — use together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# All host ports are shifted to avoid clashing with the production/staging
# services running on the same machine:
#   db:       5432  →  15432
#   dex:      5556  →  15556
#   backend:  8080  →  18080
#   frontend: 3000  →  13000
#
# The Dex OIDC redirect/browser URLs are updated accordingly so SSO still
# works when accessed at http://localhost:13000.
# by solar224
services:
  db:
    ports:
      - "15432:5432"

  dex:
    ports:
      - "15556:5556"

  backend:
    ports:
      - "18080:8080"
    environment:
      OIDC_BROWSER_AUTH_URL: http://localhost:15556/dex/auth
      OIDC_REDIRECT_URL: http://localhost:13000/api/auth/oidc/callback

  frontend:
    ports:
      - "13000:3000"
