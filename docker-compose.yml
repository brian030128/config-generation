services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env (copy from .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"

  dex:
    image: ghcr.io/dexidp/dex:v2.42.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"

  backend:
    build:
      context: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      dex:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      OIDC_ENABLED: "true"
      OIDC_ISSUER_URL: http://dex:5556/dex
      OIDC_BROWSER_AUTH_URL: http://localhost:5556/dex/auth
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set in .env}
      OIDC_REDIRECT_URL: http://localhost:3000/api/auth/oidc/callback
      OIDC_PROVIDER_NAME: GitHub
      OIDC_SUPERUSER_EMAILS: ${OIDC_SUPERUSER_EMAILS:?set in .env}
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAMESITE: Lax
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
