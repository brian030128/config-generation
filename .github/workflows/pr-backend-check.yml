name: PR Backend Check

on:
  pull_request:
    paths:
      - "backend/**"
      - "sonar-project.properties"
      - ".github/workflows/pr-backend-check.yml"
  # Also run on push to main so SonarCloud's "Overall code" view receives a
  # fresh coverage report after every merge. Without a main-branch scan, the
  # Overall coverage / new-code baseline stays empty ("No data available").
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "sonar-project.properties"
      - ".github/workflows/pr-backend-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: app_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ""
      PGDATABASE: app_test
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # SonarCloud needs full history for accurate blame / new-code analysis
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod

      - name: Cache Go build and modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Format check
        working-directory: backend
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found issues" >&2
            gofmt -l .
            exit 1
          fi

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7 # v9
        with:
          version: latest
          working-directory: backend
          args: --timeout=10m

      - name: Unit and BDD tests (with coverage)
        working-directory: backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          go test -v \
            -covermode=atomic \
            -coverpkg=./... \
            -coverprofile=coverage.out \
            ./...

      - name: Coverage summary
        working-directory: backend
        run: |
          # Exclude generated / non-production code from the report
          grep -vE '/(bddtest|dbtest|db/migrations)/' coverage.out > coverage.filtered.out || true
          mv coverage.filtered.out coverage.out

          echo "## 📊 Backend Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "**Total coverage: $TOTAL**" >> "$GITHUB_STEP_SUMMARY"
          echo "coverage=$TOTAL" >> "$GITHUB_OUTPUT"

          # Generate HTML report for artifact download
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 14

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io

      - name: Build binary
        working-directory: backend
        run: go build ./...
